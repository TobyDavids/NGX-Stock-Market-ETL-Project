version: '3.8'

services:
  selenium:
    environment:
      - SE_NODE_MAX_SESSIONS=4
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SE_NODE_SESSION_TIMEOUT=300
      - SE_NODE_BROWSER_TIMEOUT=300
      - SE_NODE_IMPLICIT_WAIT=10
    shm_size: '2gb'
    volumes:
      - /dev/shm:/dev/shm
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:4444/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-worker:
    depends_on:
      selenium:
        condition: service_healthy
    environment:
      &airflow-common-env
      SELENIUM_URL: "http://selenium:4444/wd/hub"

  airflow-scheduler:
    depends_on:
      selenium:
        condition: service_healthy

  airflow-apiserver:
    depends_on:
      selenium:
        condition: service_healthy 